<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confraternização AVSEG 2025</title>

    <!-- Fonte LEMON MILK -->
    <style>
        @font-face {
            font-family: "LemonMilk";
            src: url("LEMONMILK-Bold.otf") format("opentype");
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: white;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-family: "LemonMilk", sans-serif;
            font-size: 32px;
            margin-top: 10px;
        }

        .container {
            max-width: 420px;
            margin: auto;
            background: #1b1b1b;
            padding: 20px;
            border-radius: 12px;
        }

        input, select {
            width: 92%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            border: none;
            outline: none;
        }

        button {
            width: 95%;
            background: #d4af37;
            color: black;
            border: none;
            padding: 12px;
            margin-top: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:disabled {
            background: gray;
            cursor: not-allowed;
        }

        /* BOTÃO SECRETO (invisível) */
        .secret-btn {
            position: fixed;
            top: 5px;
            right: 5px;
            width: 30px;
            height: 30px;
            opacity: 0;
            cursor: pointer;
            z-index: 999;
        }
    </style>
</head>
<body>

    <!-- Botão invisível para admin -->
    <div class="secret-btn" onclick="window.location.href='admin.html'"></div>

    <img src="logo.png" width="120">
    <h1>Confraternização AVSEG 2025</h1>

    <div class="container">
        <h2>Confirme sua presença</h2>

        <input type="text" id="name" placeholder="Seu nome completo">

        <input type="text" id="phone" placeholder="Seu WhatsApp (somente números)" maxlength="11">

        <select id="acompanhanteSelect" onchange="toggleAcompanhante()">
            <option value="nao">Vai levar acompanhante?</option>
            <option value="nao">Não</option>
            <option value="sim">Sim</option>
        </select>

        <input type="text" id="acompanhanteNome" placeholder="Nome do acompanhante" style="display:none;">

        <button id="confirmButton" onclick="sendConfirmation()">Confirmar Presença</button>

        <p id="status" style="margin-top: 15px; font-size: 14px;"></p>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "SUA-API",
            authDomain: "avseg-confraternizacao.firebaseapp.com",
            projectId: "avseg-confraternizacao",
            storageBucket: "avseg-confraternizacao.appspot.com",
            messagingSenderId: "",
            appId: ""
        };

        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Mostrar campo do acompanhante quando necessário
        function toggleAcompanhante() {
            const select = document.getElementById("acompanhanteSelect");
            const field = document.getElementById("acompanhanteNome");

            if (select.value === "sim") {
                field.style.display = "block";
            } else {
                field.style.display = "none";
                field.value = "";
            }
        }

        // Função que formata o telefone apenas na lista
        function formatPhone(phone) {
            return phone.replace(/^(\d{2})(\d{5})(\d{4})$/, "($1) $2-$3");
        }

        // Verifica no Firestore se novas confirmações estão habilitadas
        async function checkEnabled() {
            const docRef = db.collection("config").doc("settings");
            const snap = await docRef.get();

            if (snap.exists && snap.data().confirmationsEnabled === false) {
                document.getElementById("confirmButton").disabled = true;
                document.getElementById("status").innerText = "As confirmações estão desativadas no momento.";
            }
        }

        checkEnabled();

        async function sendConfirmation() {
            const name = document.getElementById("name").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const acompanhante = document.getElementById("acompanhanteSelect").value;
            const nomeAcompanhante = document.getElementById("acompanhanteNome").value.trim();

            const status = document.getElementById("status");

            status.innerText = "";

            if (name.length < 3) {
                status.innerText = "Digite um nome válido.";
                return;
            }

            if (!/^\d{10,11}$/.test(phone)) {
                status.innerText = "Digite um telefone válido (somente números).";
                return;
            }

            if (acompanhante === "sim" && nomeAcompanhante.length < 3) {
                status.innerText = "Digite o nome do acompanhante.";
                return;
            }

            // Bloqueia duplicados
            const q = await db.collection("confirmacoes")
                .where("phone", "==", phone)
                .get();

            const q2 = await db.collection("confirmacoes")
                .where("name", "==", name)
                .get();

            if (!q.empty || !q2.empty) {
                status.innerText = "Você já confirmou sua presença.";
                return;
            }

            const formattedPhone = formatPhone(phone);

            await db.collection("confirmacoes").add({
                name,
                phone: formattedPhone,
                acompanhante: nomeAcompanhante || null,
                timestamp: Date.now()
            });

            status.innerText = "Presença confirmada com sucesso!";
            document.getElementById("name").value = "";
            document.getElementById("phone").value = "";
            document.getElementById("acompanhanteSelect").value = "nao";
            toggleAcompanhante();
        }
    </script>
</body>
</html>
