<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" href="favicon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin - Confraternização AVSEG 2025</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #000, #ffd60a);
      color: white;
      margin: 0;
      padding: 20px;
      text-align: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    #totais {
      background: rgba(255, 255, 255, 0.15);
      padding: 15px 25px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 25px;
      font-weight: bold;
      text-align: left;
      line-height: 1.8;
    }

    table {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      border-collapse: collapse;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      overflow: hidden;
      backdrop-filter: blur(6px);
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 0.95rem;
    }

    th {
      background: rgba(255, 214, 10, 0.3);
      color: #000;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .voltar {
      display: inline-block;
      margin-top: 30px;
      background: #ffd60a;
      color: #000;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .voltar:hover {
      background: #ffea00;
    }

    .btn-excluir {
      background: #ff4b4b;
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn-excluir:hover {
      background: #ff1a1a;
    }

    #baixarExcel {
      margin-left: 10px;
      background: #00c853;
      color: #fff;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    #baixarExcel:hover {
      background: #00e676;
    }

    /* Tela de senha */
    #senhaContainer {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #000, #ffd60a);
    }

    #senhaContainer input {
      padding: 10px;
      border: none;
      border-radius: 8px;
      width: 200px;
      text-align: center;
      font-size: 1rem;
      margin-bottom: 10px;
    }

    #senhaContainer button {
      background: #ffd60a;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    #senhaContainer button:hover {
      background: #ffea00;
    }
  </style>
</head>
<body>
  <div id="senhaContainer">
    <h2>🔒 Acesso restrito</h2>
    <input type="password" id="senhaInput" placeholder="Digite a senha">
    <button id="entrarBtn">Entrar</button>
    <p id="erroSenha" style="color:red; display:none;">Senha incorreta!</p>
  </div>

  <div id="conteudo" style="display:none;">
    <h1>🎉 Painel de Confirmações - AVSEG 2025</h1>

    <div id="totais">
      ✅ Total de confirmações: <span id="contador">0</span><br>
      👥 Total de pessoas (incluindo acompanhantes): <span id="totalPessoas">0</span><br>
      📥 <button id="baixarExcel">Baixar lista (Excel)</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Telefone</th>
          <th>Acompanhante?</th>
          <th>Nome do acompanhante</th>
          <th>Data</th>
          <th>Ação</th>
        </tr>
      </thead>
      <tbody id="tabela"></tbody>
    </table>

    <a href="index.html" class="voltar">⬅ Voltar ao site</a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      getDocs, 
      query, 
      orderBy, 
      deleteDoc, 
      doc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import * as XLSX from "https://cdn.sheetjs.com/xlsx-0.20.1/package/xlsx.mjs";

    const senhaCorreta = "avseg2025"; // 🔐 Defina a senha aqui

    const senhaContainer = document.getElementById("senhaContainer");
    const conteudo = document.getElementById("conteudo");
    const entrarBtn = document.getElementById("entrarBtn");
    const senhaInput = document.getElementById("senhaInput");
    const erroSenha = document.getElementById("erroSenha");

    entrarBtn.addEventListener("click", () => {
      if (senhaInput.value === senhaCorreta) {
        senhaContainer.style.display = "none";
        conteudo.style.display = "block";
        carregarConfirmacoes();
      } else {
        erroSenha.style.display = "block";
      }
    });

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDvKQsFMVbpsA0jGnPSO37tRp2bDP8dZFE",
      authDomain: "avseg-confraternizacao.firebaseapp.com",
      projectId: "avseg-confraternizacao",
      storageBucket: "avseg-confraternizacao.appspot.com",
      messagingSenderId: "1022261557627",
      appId: "1:1022261557627:web:ef69e37be5c367411665de"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const tabela = document.getElementById('tabela');
    const contador = document.getElementById('contador');
    const totalPessoas = document.getElementById('totalPessoas');
    const baixarExcel = document.getElementById('baixarExcel');

    async function carregarConfirmacoes() {
      const q = query(collection(db, "confirmados"), orderBy("data", "desc"));
      const snapshot = await getDocs(q);

      tabela.innerHTML = '';
      let total = 0;
      let totalGeral = 0;
      const dadosExportar = [];

      snapshot.forEach(docSnap => {
        const dados = docSnap.data();
        total++;
        totalGeral += (dados.acompanhante === 'sim' ? 2 : 1);

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${dados.nome}</td>
          <td>${dados.telefone}</td>
          <td>${dados.acompanhante === 'sim' ? 'Sim' : 'Não'}</td>
          <td>${dados.acompanhante === 'sim' ? (dados.nomeAcompanhante || '-') : '-'}</td>
          <td>${new Date(dados.data).toLocaleString('pt-BR')}</td>
          <td><button class="btn-excluir" data-id="${docSnap.id}">Excluir</button></td>
        `;
        tabela.appendChild(tr);

        dadosExportar.push({
          Nome: dados.nome,
          Telefone: dados.telefone,
          "Acompanhante?": dados.acompanhante === 'sim' ? 'Sim' : 'Não',
          "Nome do acompanhante": dados.acompanhante === 'sim' ? (dados.nomeAcompanhante || '-') : '-',
          Data: new Date(dados.data).toLocaleString('pt-BR')
        });
      });

      contador.textContent = total;
      totalPessoas.textContent = totalGeral;

      document.querySelectorAll('.btn-excluir').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-id');
          if (confirm('Tem certeza que deseja excluir esta confirmação?')) {
            await deleteDoc(doc(db, "confirmados", id));
            carregarConfirmacoes();
          }
        });
      });

      baixarExcel.onclick = () => {
        const ws = XLSX.utils.json_to_sheet(dadosExportar);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Confirmações");
        XLSX.writeFile(wb, "confirmacoes_AVSEG_2025.xlsx");
      };
    }
  </script>
</body>
</html>
